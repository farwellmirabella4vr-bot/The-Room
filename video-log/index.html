<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Log — 2026</title>
<!--
  Video Log Calendar — companion site for a daily video journal filmed
  through 2026, each day posting to YouTube exactly one year later.
  Single-file, no build step. data.json is loaded via fetch() after the
  entrance gate is tapped, which means this page needs a real HTTP server
  (e.g. GitHub Pages) — opening it directly as a local file:// URL will
  fail the fetch and show an in-page error instead of the calendar.

  Visual system: same mosque-wall gold/ivory palette and teal accent as
  the rest of the site, but deliberately plainer than room.html/home.html
  -- a flat backdrop instead of a painted sunset scene, panels without a
  tiled texture or stacked shadows, and a contained "screen" around the
  calendar grid -- aiming for a simple, low-chrome, pocket-tracker feel
  rather than an ornamented one.
-->
<style>

  :root {
    --wall:        #3a1f2e;
    --wall-dark:   #241220;
    --wall-light:  #4d2a3c;
    --gold:        #d4a24c;
    --gold-bright: #f2c879;
    --ivory:       #f4e8d0;
    --ivory-dim:   #cbb999;
    --ember:       #ff9d4d;

    --teal:        #3fb6a8;
    --teal-bright: #6cc9ba;

    --cat-did:      var(--ember);
    --cat-watched:  var(--gold);
    --cat-spoke:    #d97a6a;
    --cat-listened: #9a7fd4;
    --cat-learned:  var(--gold-bright);
    --cat-notes:    var(--teal-bright);

    /* One flat backdrop reused everywhere (was a 5-stop "sunset scene"
       gradient repeated on body/gate/day-view) and one soft shadow reused
       on every panel (was a heavier double-shadow + inset-border combo
       per panel) -- part of trimming this page down to a plainer,
       pocket-device feel instead of a painted backdrop with ornamented
       panels on top of it. */
    --bg:          linear-gradient(180deg, var(--wall-dark) 0%, #170d14 100%);
    --shadow-soft: 0 2px 8px rgba(0, 0, 0, 0.28);
    --mono: "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  /* The hidden attribute must always win, even over elements whose own
     class sets display:flex/grid (author CSS otherwise beats the
     browser's built-in [hidden] rule at equal specificity). */
  [hidden] { display: none !important; }
  body {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    color: var(--ivory);
    background: var(--bg);
    background-attachment: fixed;
    min-height: 100vh;
    padding-bottom: 4rem;
  }
  a { color: var(--gold-bright); }
  h1, h2, h3 { margin: 0; }

  /* ---------- entrance gate ---------- */
  .gate {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    background: var(--bg);
    z-index: 200;
  }
  .gate-btn {
    font-size: 0.95rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: bold;
    background: linear-gradient(180deg, var(--teal-bright), var(--teal));
    color: #04211d;
    border: none;
    border-radius: 10px;
    padding: 0.85rem 2rem;
    cursor: pointer;
  }
  .gate-btn:active { background: var(--teal-bright); }
  .gate-sub {
    font-size: 0.85rem;
    color: var(--ivory-dim);
    margin: 0;
  }
  .gate-error {
    max-width: 320px;
    text-align: center;
    font-size: 0.8rem;
    color: #ffc9c9;
    display: none;
  }

  /* ---------- header ---------- */
  .site-header {
    max-width: 900px;
    margin: 0 auto;
    padding: 1.1rem 1.25rem 0.6rem;
    text-align: center;
  }
  .back-link {
    display: inline-block;
    font-size: 0.8rem;
    color: var(--ivory-dim);
    text-decoration: none;
  }
  .back-link:hover { color: var(--gold-bright); }
  .site-title {
    margin: 0.5rem 0 0;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
    font-family: var(--mono);
    font-size: clamp(1.1rem, 3.5vw, 1.5rem);
    color: var(--gold-bright);
  }

  /* ---------- calendar screen: a plain contained "device screen" holding
     the month tabs + day grid, instead of them floating loose over the
     page backdrop ---------- */
  .calendar-screen {
    max-width: 900px;
    margin: 0 auto 1rem;
    padding: 0.6rem 0.25rem 0.8rem;
    background: var(--wall-dark);
    border: 1px solid rgba(63, 182, 168, 0.3);
    border-radius: 10px;
    box-shadow: var(--shadow-soft);
  }

  /* ---------- month tabs ---------- */
  .month-tabs {
    display: flex;
    gap: 0.35rem;
    overflow-x: auto;
    padding: 0 1rem 0.7rem;
    scrollbar-width: thin;
  }
  .month-tab {
    flex: 0 0 auto;
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    background: transparent;
    border: 1px solid rgba(212, 162, 76, 0.3);
    color: var(--ivory-dim);
    border-radius: 6px;
    padding: 0.35rem 0.7rem;
    cursor: pointer;
  }
  .month-tab.active { color: #04211d; background: var(--teal-bright); border-color: var(--teal-bright); }

  /* ---------- day grid ---------- */
  .day-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0.3rem;
    padding: 0 1rem;
  }
  .day-cell {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 6px;
    background-color: rgba(0, 0, 0, 0.24);
    background-size: cover;
    background-position: center;
    border: 1px solid rgba(212, 162, 76, 0.2);
    padding: 0.3rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: var(--ivory-dim);
    cursor: default;
  }
  button.day-cell { text-align: left; font-family: inherit; }
  button.day-cell.has-entry {
    color: var(--ivory);
    border-color: rgba(212, 162, 76, 0.4);
    cursor: pointer;
  }
  button.day-cell.has-entry:hover { border-color: var(--teal-bright); }
  .day-num { font-family: var(--mono); font-size: 0.72rem; font-weight: bold; }
  .day-dots { display: flex; gap: 0.2rem; flex-wrap: wrap; }
  .day-dot { width: 5px; height: 5px; border-radius: 50%; }
  .day-dot.cat-did { background: var(--cat-did); }
  .day-dot.cat-watched { background: var(--cat-watched); }
  .day-dot.cat-spoke { background: var(--cat-spoke); }
  .day-dot.cat-listened { background: var(--cat-listened); }
  .day-dot.cat-learned { background: var(--cat-learned); }

  .load-error {
    grid-column: 1 / -1;
    font-size: 0.85rem;
    color: #ffc9c9;
    text-align: center;
    padding: 2rem 1rem;
  }

  /* ---------- day view ---------- */
  .day-view {
    position: fixed;
    inset: 0;
    background: var(--bg);
    background-attachment: fixed;
    z-index: 100;
    overflow-y: auto;
    padding-bottom: 3.5rem;
  }
  .day-close {
    position: sticky;
    top: 0.6rem;
    left: 1rem;
    z-index: 5;
    display: inline-block;
    margin: 0.6rem 0 0 1rem;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(212, 162, 76, 0.35);
    color: var(--ivory-dim);
    border-radius: 6px;
    padding: 0.3rem 0.7rem;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .day-view-inner { max-width: 700px; margin: 0 auto; padding: 0 1.25rem; }
  .day-title {
    margin: 0.6rem 0 0.5rem;
    font-weight: bold;
    font-size: clamp(1.1rem, 3.5vw, 1.5rem);
    line-height: 1.3;
    color: var(--gold-bright);
  }
  .log-day-btn {
    display: block;
    margin-bottom: 0.9rem;
    background: none;
    border: 1px solid rgba(63, 182, 168, 0.4);
    color: var(--teal-bright);
    border-radius: 6px;
    padding: 0.35rem 0.7rem;
    font-size: 0.72rem;
    cursor: pointer;
    font-family: inherit;
  }

  /* ---------- carousel ---------- */
  .carousel { margin: 0; }
  .carousel-track {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    gap: 0.5rem;
    border-radius: 8px;
  }
  .carousel-slide {
    flex: 0 0 100%;
    scroll-snap-align: center;
    aspect-ratio: 4 / 5;
    border-radius: 8px;
    overflow: hidden;
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(212, 162, 76, 0.2);
  }
  .carousel-slide img, .carousel-slide video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .carousel-audio-slide {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.8rem;
    background: linear-gradient(160deg, var(--wall-light) 0%, var(--wall-dark) 100%);
  }
  .carousel-audio-icon { font-size: 2.4rem; }
  .carousel-audio-slide audio { width: 85%; }
  .carousel-dots {
    display: flex;
    justify-content: center;
    gap: 0.35rem;
    margin-top: 0.4rem;
  }
  .carousel-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(212, 162, 76, 0.3); }
  .carousel-dot.active { background: var(--gold-bright); }

  /* ---------- section nav ---------- */
  .section-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin: 0.7rem 0 0;
  }
  .section-pill {
    font-family: inherit;
    font-size: 0.72rem;
    letter-spacing: 0.03em;
    background: transparent;
    border: 1px solid rgba(212, 162, 76, 0.3);
    border-radius: 6px;
    padding: 0.32rem 0.7rem;
    cursor: pointer;
  }
  .section-pill.cat-did { color: var(--cat-did); border-color: var(--cat-did); }
  .section-pill.cat-watched { color: var(--cat-watched); border-color: var(--cat-watched); }
  .section-pill.cat-spoke { color: var(--cat-spoke); border-color: var(--cat-spoke); }
  .section-pill.cat-listened { color: var(--cat-listened); border-color: var(--cat-listened); }
  .section-pill.cat-learned { color: var(--cat-learned); border-color: var(--cat-learned); }
  .section-pill.cat-notes { color: var(--cat-notes); border-color: var(--cat-notes); }

  /* ---------- day sections ---------- */
  .day-section {
    margin: 0.6rem 0 0;
    padding: 0.7rem 0.9rem 0.8rem;
    background: var(--wall);
    border: 1px solid rgba(212, 162, 76, 0.25);
    border-radius: 8px;
    box-shadow: var(--shadow-soft);
    scroll-margin-top: 3.2rem;
  }
  .day-section h3 {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--gold-bright);
    margin-bottom: 0.4rem;
    padding-left: 0.55rem;
    border-left: 3px solid rgba(212, 162, 76, 0.3);
  }
  #secDid h3 { border-color: var(--cat-did); }
  #secWatched h3 { border-color: var(--cat-watched); }
  #secSpoke h3 { border-color: var(--cat-spoke); }
  #secListened h3 { border-color: var(--cat-listened); }
  #secLearned h3 { border-color: var(--cat-learned); }
  #secNotes h3 { border-color: var(--cat-notes); }
  .note-item-title { font-weight: bold; color: var(--cat-notes); margin-bottom: 0.2rem; }
  .note-item-excerpt { color: var(--ivory-dim); font-size: 0.78rem; }
  .notes-connect-row {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1.25rem 0.5rem;
    text-align: center;
    font-size: 0.72rem;
    color: var(--ivory-dim);
  }
  .notes-connect-row button {
    background: none;
    border: 1px solid rgba(63, 182, 168, 0.4);
    color: var(--teal-bright);
    border-radius: 6px;
    padding: 0.3rem 0.7rem;
    font-size: 0.7rem;
    cursor: pointer;
    font-family: inherit;
  }

  .day-section p { line-height: 1.5; font-size: 0.9rem; color: var(--ivory); }
  .day-section ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.4rem; }
  .day-section li {
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid rgba(212, 162, 76, 0.2);
    border-radius: 6px;
    padding: 0.45rem 0.65rem;
    font-size: 0.82rem;
  }

  #secLearned { border-color: rgba(242, 200, 121, 0.4); }
  #secLearned p {
    font-size: 0.95rem;
    line-height: 1.75;
    color: var(--ivory);
  }

  /* ---------- player bar ---------- */
  .player-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 150;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    background: linear-gradient(160deg, var(--wall-light) 0%, var(--wall-dark) 100%);
    border-top: 1px solid var(--teal);
    padding: 0.6rem 1rem;
  }
  .player-toggle {
    flex: 0 0 auto;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: linear-gradient(180deg, var(--teal-bright), var(--teal));
    color: #04211d;
    border: none;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .player-info { flex: 1 1 auto; min-width: 0; }
  .player-label {
    display: block;
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ivory-dim);
  }
  .player-title {
    display: block;
    font-size: 0.85rem;
    color: var(--ivory);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---------- scroll reveal: fade/slide content in once, as it enters view.
     Since each .day-section only starts intersecting once its own
     [hidden] toggle (set per-category when a day opens) is lifted, this
     doubles as a "sections fade in as they appear" effect for free. */
  .reveal { transition: opacity 0.45s ease, transform 0.45s ease; }
  .reveal:not(.in-view) { opacity: 0; transform: translateY(12px); }
  @media (prefers-reduced-motion: reduce) {
    .reveal:not(.in-view) { opacity: 1; transform: none; transition: none; }
  }

</style>
</head>
<body>

  <div class="gate" id="gate">
    <button type="button" class="gate-btn" id="gateBtn">Tap to Enter</button>
    <p class="gate-sub">A year, one day at a time.</p>
    <p class="gate-error" id="gateError"></p>
  </div>

  <div class="app" id="app" hidden>

    <header class="site-header">
      <a class="back-link" href="../room.html">&larr; Back to the Room</a>
      &nbsp;·&nbsp;
      <a class="back-link" href="../home.html">Home</a>
      &nbsp;·&nbsp;
      <a class="back-link" href="editor.html">Editor</a>
      <h1 class="site-title">Video Log</h1>
    </header>

    <div class="calendar-screen">
      <nav class="month-tabs" id="monthTabs"></nav>
      <div class="day-grid" id="dayGrid"></div>
    </div>

    <p class="notes-connect-row">
      <span id="notesStatus">Obsidian notes not connected.</span>
      <button type="button" id="connectNotesBtn">Connect Notes Folder</button>
    </p>

    <div class="day-view" id="dayView" hidden>
      <button type="button" class="day-close" id="dayClose">&times; Close</button>

      <div class="day-view-inner">
        <h2 class="day-title" id="dayTitle"></h2>
        <button type="button" class="log-day-btn" id="logDayBtn">Log this day to Obsidian</button>

        <div class="carousel" id="carousel" hidden>
          <div class="carousel-track" id="carouselTrack"></div>
          <div class="carousel-dots" id="carouselDots"></div>
        </div>

        <nav class="section-nav" id="sectionNav"></nav>

        <section class="day-section reveal" id="secDid" data-cat="did" hidden>
          <h3>Did</h3>
          <p id="didText"></p>
        </section>

        <section class="day-section reveal" id="secWatched" data-cat="watched" hidden>
          <h3>Watched</h3>
          <ul id="watchedList"></ul>
        </section>

        <section class="day-section reveal" id="secSpoke" data-cat="spoke" hidden>
          <h3>Spoke</h3>
          <ul id="spokeList"></ul>
        </section>

        <section class="day-section reveal" id="secListened" data-cat="listened" hidden>
          <h3>Listened</h3>
          <ul id="listenedList"></ul>
        </section>

        <section class="day-section reveal" id="secLearned" data-cat="learned" hidden>
          <h3>Learned</h3>
          <p id="learnedText"></p>
        </section>

        <section class="day-section reveal" id="secNotes" data-cat="notes" hidden>
          <h3>Obsidian Notes</h3>
          <ul id="notesListEl"></ul>
        </section>
      </div>
    </div>

  </div>

  <div class="player-bar" id="playerBar" hidden>
    <button type="button" class="player-toggle" id="playerToggle">&#9654;</button>
    <div class="player-info">
      <span class="player-label">Now Playing</span>
      <span class="player-title" id="playerTitle"></span>
    </div>
    <audio id="playerAudio"></audio>
  </div>

<script>
(() => {
  const YEAR = 2026;
  const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const SECTION_LABELS = { did: "Did", watched: "Watched", spoke: "Spoke", listened: "Listened", learned: "Learned" };

  const state = {
    data: null,
    currentMonth: new Date().getMonth() + 1,
    audioUnlocked: false,
  };

  function daysInMonth(month) {
    return new Date(YEAR, month, 0).getDate();
  }

  function categoriesForEntry(entry) {
    if (!entry) return [];
    const cats = [];
    if (entry.did) cats.push("did");
    if (Array.isArray(entry.watched) && entry.watched.length) cats.push("watched");
    if (Array.isArray(entry.spoke) && entry.spoke.length) cats.push("spoke");
    if (Array.isArray(entry.listened) && entry.listened.length) cats.push("listened");
    if (entry.learned) cats.push("learned");
    return cats;
  }

  function firstImageThumb(entry) {
    if (!entry || !Array.isArray(entry.media)) return null;
    const img = entry.media.find((m) => m.type === "image" && m.url);
    return img ? img.url : null;
  }

  // ============================================================
  // OBSIDIAN NOTES — read-only. Reads the same bridge folder the Nest
  // of Knowledge Sync Obsidian plugin writes to, via the File System
  // Access API (same mechanism as Beat Maker's footage-import folder).
  // The folder handle is stored in an IndexedDB database shared across
  // every life-hub page, so connecting it once anywhere (this page or
  // Nest of Knowledge) means every other page picks it up without
  // asking again. Only ever reads; nothing here writes anything back.
  // ============================================================
  const HANDLE_DB = "life-hub-shared-handles";
  function getHandleDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(HANDLE_DB, 1);
      req.onupgradeneeded = () => { req.result.createObjectStore("handles", { keyPath: "id" }); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function saveHandle(id, handle) {
    const db = await getHandleDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction("handles", "readwrite");
      tx.objectStore("handles").put({ id, handle });
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  }
  async function loadHandle(id) {
    const db = await getHandleDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction("handles", "readonly");
      const req = tx.objectStore("handles").get(id);
      req.onsuccess = () => resolve(req.result ? req.result.handle : null);
      req.onerror = () => reject(req.error);
    });
  }

  let notesDirHandle = null;
  let notesIndex = null;
  const notesStatusEl = document.getElementById("notesStatus");
  const connectNotesBtn = document.getElementById("connectNotesBtn");
  const fsAccessSupported = typeof window.showDirectoryPicker === "function";

  function setNotesStatus(text) { notesStatusEl.textContent = text; }

  if (!fsAccessSupported) {
    connectNotesBtn.disabled = true;
    setNotesStatus("Obsidian notes need Edge or Chrome on desktop.");
  }

  async function loadNotesIndex() {
    if (!notesDirHandle) { notesIndex = null; return; }
    try {
      const fileHandle = await notesDirHandle.getFileHandle("_index.json");
      const file = await fileHandle.getFile();
      notesIndex = JSON.parse(await file.text());
    } catch (e) {
      notesIndex = null; // folder connected but no index yet (nothing synced from Obsidian so far)
    }
  }

  async function tryRestoreNotesFolder() {
    let handle;
    try { handle = await loadHandle("notesFolder"); } catch (e) { return; }
    if (!handle) return;
    if ((await handle.queryPermission({ mode: "read" })) === "granted") {
      notesDirHandle = handle;
      await loadNotesIndex();
      setNotesStatus("Obsidian notes connected (" + handle.name + "/).");
    } else {
      setNotesStatus("Notes folder connected previously — click to reconnect.");
    }
  }

  if (fsAccessSupported) {
    connectNotesBtn.addEventListener("click", async () => {
      try {
        const handle = await window.showDirectoryPicker({ id: "life-hub-notes", mode: "read" });
        notesDirHandle = handle;
        await saveHandle("notesFolder", handle);
        await loadNotesIndex();
        setNotesStatus("Obsidian notes connected (" + handle.name + "/).");
      } catch (e) {
        // user cancelled the picker — leave prior state alone
      }
    });
    tryRestoreNotesFolder();
  }

  function notesForDate(iso) {
    if (!notesIndex) return [];
    return Object.values(notesIndex).filter((n) => n.date === iso);
  }

  // ============================================================
  // LOG DAY TO OBSIDIAN — the reverse direction: writes a real dated
  // note (YYYY-MM-DD.md) into the vault's Rough Notes folder. Since
  // that filename matches the sync plugin's own date pattern, the note
  // loops back through the existing sync next time it runs and shows
  // up right back in this same day's Notes section above — deliberate,
  // not a coincidence. A different, readwrite folder connection than
  // notesDirHandle above (which is read-only and points at the sync
  // plugin's bridge folder, not the vault itself), stored under its
  // own key in the same shared handle database.
  // ============================================================
  let roughNotesDirHandle = null;
  async function ensureWritePermission(handle) {
    const opts = { mode: "readwrite" };
    if ((await handle.queryPermission(opts)) === "granted") return true;
    try { return (await handle.requestPermission(opts)) === "granted"; }
    catch (e) { return false; }
  }
  async function tryRestoreRoughNotesFolder() {
    let handle;
    try { handle = await loadHandle("roughNotesFolder"); } catch (e) { return; }
    if (!handle) return;
    if ((await handle.queryPermission({ mode: "readwrite" })) === "granted") roughNotesDirHandle = handle;
  }
  async function connectRoughNotesFolder() {
    if (typeof window.showDirectoryPicker !== "function") return false;
    try {
      const handle = await window.showDirectoryPicker({ id: "life-hub-rough-notes", mode: "readwrite" });
      roughNotesDirHandle = handle;
      await saveHandle("roughNotesFolder", handle);
      return true;
    } catch (e) { return false; }
  }
  async function writeNoteToVault(filename, content) {
    if (!roughNotesDirHandle) {
      const connected = await connectRoughNotesFolder();
      if (!connected) return false;
    }
    if (!(await ensureWritePermission(roughNotesDirHandle))) return false;
    try {
      const fileHandle = await roughNotesDirHandle.getFileHandle(filename, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(content);
      await writable.close();
      return true;
    } catch (e) { return false; }
  }
  tryRestoreRoughNotesFolder();

  function dayEntryToNoteContent(entry, iso) {
    const lines = ["#baby", "", "# " + (entry.title || iso), ""];
    if (entry.did) { lines.push("## Did", "", entry.did, ""); }
    if (Array.isArray(entry.watched) && entry.watched.length) {
      lines.push("## Watched", "");
      entry.watched.forEach((w) => lines.push("- " + (w.url ? "[" + (w.title || w.url) + "](" + w.url + ")" : (w.title || ""))));
      lines.push("");
    }
    if (Array.isArray(entry.spoke) && entry.spoke.length) {
      lines.push("## Spoke", "");
      entry.spoke.forEach((s) => lines.push("- " + (s.lang ? s.lang + " — " : "") + (s.note || "")));
      lines.push("");
    }
    if (Array.isArray(entry.listened) && entry.listened.length) {
      lines.push("## Listened", "");
      entry.listened.forEach((l) => lines.push("- " + (l.url ? "[" + (l.title || l.url) + "](" + l.url + ")" : (l.title || ""))));
      lines.push("");
    }
    if (entry.learned) { lines.push("## Learned", "", entry.learned, ""); }
    lines.push("## References", "- ");
    return lines.join("\n");
  }

  // ---------- entrance gate ----------
  // Entering the site (hiding the gate, showing the calendar) must never be
  // blocked by anything else — not the iOS audio-unlock trick, not the
  // data.json fetch. Both of those run only after you're already in, and
  // both are wrapped so a failure in either can't leave the gate stuck.
  document.getElementById("gateBtn").addEventListener("click", () => {
    document.getElementById("gate").hidden = true;
    document.getElementById("app").hidden = false;
    state.audioUnlocked = true;

    try {
      const audio = document.getElementById("playerAudio");
      audio.muted = true;
      const p = audio.play();
      if (p && typeof p.then === "function") {
        p.then(() => { audio.pause(); audio.muted = false; }).catch(() => { audio.muted = false; });
      } else {
        audio.muted = false;
      }
    } catch (e) { /* audio unlock is best-effort only */ }

    loadCalendarData();
  });

  async function loadCalendarData() {
    try {
      const res = await fetch("data.json");
      if (!res.ok) throw new Error("HTTP " + res.status);
      state.data = await res.json();
    } catch (e) {
      document.getElementById("dayGrid").innerHTML =
        '<p class="load-error">Could not load data.json. This page needs to be served over HTTP ' +
        '(e.g. GitHub Pages) — opening index.html directly as a local file won’t work.</p>';
      renderMonthTabs();
      return;
    }

    // If today's real-world month has no entries yet, land on the first
    // month that does, so a fresh/partial dataset doesn't look empty.
    const entries = state.data.entries || {};
    const hasCurrentMonth = entries[String(state.currentMonth)] && Object.keys(entries[String(state.currentMonth)]).length;
    if (!hasCurrentMonth) {
      const monthsWithData = Object.keys(entries)
        .map(Number)
        .filter((m) => Object.keys(entries[String(m)]).length)
        .sort((a, b) => a - b);
      if (monthsWithData.length) state.currentMonth = monthsWithData[0];
    }

    renderMonthTabs();
    renderDayGrid();
  }

  // ---------- calendar ----------
  function renderMonthTabs() {
    const wrap = document.getElementById("monthTabs");
    wrap.innerHTML = "";
    MONTH_NAMES.forEach((name, i) => {
      const month = i + 1;
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "month-tab" + (month === state.currentMonth ? " active" : "");
      btn.textContent = name.slice(0, 3);
      btn.addEventListener("click", () => {
        state.currentMonth = month;
        renderMonthTabs();
        renderDayGrid();
      });
      wrap.appendChild(btn);
    });
  }

  function renderDayGrid() {
    const grid = document.getElementById("dayGrid");
    grid.innerHTML = "";
    if (!state.data) return;
    const month = state.currentMonth;
    const total = daysInMonth(month);
    const monthEntries = (state.data.entries && state.data.entries[String(month)]) || {};

    for (let day = 1; day <= total; day++) {
      const entry = monthEntries[String(day)];
      const cats = categoriesForEntry(entry);
      const thumb = firstImageThumb(entry);

      const cell = document.createElement(entry ? "button" : "div");
      if (entry) cell.type = "button";
      cell.className = "day-cell" + (entry ? " has-entry" : "");
      if (thumb) {
        cell.style.backgroundImage = "linear-gradient(rgba(10,11,13,0.5), rgba(10,11,13,0.75)), url('" + thumb + "')";
      }

      const num = document.createElement("span");
      num.className = "day-num";
      num.textContent = day;
      cell.appendChild(num);

      if (cats.length) {
        const dots = document.createElement("span");
        dots.className = "day-dots";
        cats.forEach((c) => {
          const dot = document.createElement("span");
          dot.className = "day-dot cat-" + c;
          dots.appendChild(dot);
        });
        cell.appendChild(dots);
      }

      if (entry) {
        cell.addEventListener("click", () => openDay(month, day));
      }

      grid.appendChild(cell);
    }
  }

  // ---------- day view ----------
  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  let currentDayEntry = null;
  let currentDayIso = null;

  function openDay(month, day) {
    const entry = state.data.entries[String(month)][String(day)];
    if (!entry) return;

    document.getElementById("dayTitle").textContent = entry.title || (MONTH_NAMES[month - 1] + " " + day);

    renderCarousel(entry.media || []);
    renderSectionNav(entry);
    renderSections(entry);
    const iso = YEAR + "-" + String(month).padStart(2, "0") + "-" + String(day).padStart(2, "0");
    renderNotesSection(iso);
    playBeatForDay(month, day);

    currentDayEntry = entry;
    currentDayIso = iso;

    const view = document.getElementById("dayView");
    view.hidden = false;
    view.scrollTop = 0;
  }

  document.getElementById("logDayBtn").addEventListener("click", async () => {
    if (!currentDayEntry || !currentDayIso) return;
    const btn = document.getElementById("logDayBtn");
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Logging…";
    const content = dayEntryToNoteContent(currentDayEntry, currentDayIso);
    const ok = await writeNoteToVault(currentDayIso + ".md", content);
    btn.textContent = ok ? "Logged ✓ (will show up here once synced back)" : "Couldn't log";
    setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 2500);
  });

  // Independent of categoriesForEntry/renderSections on purpose — notes
  // come from the connected local folder, not from entry itself, so this
  // stays a separate step rather than reshaping the entry-driven functions
  // above it.
  function renderNotesSection(iso) {
    const notes = notesForDate(iso);
    document.getElementById("secNotes").hidden = !notes.length;
    const list = document.getElementById("notesListEl");
    list.innerHTML = "";
    notes.forEach((note) => {
      const li = document.createElement("li");
      const title = document.createElement("div");
      title.className = "note-item-title";
      title.textContent = note.title;
      const excerpt = document.createElement("div");
      excerpt.className = "note-item-excerpt";
      excerpt.textContent = note.excerpt || "";
      li.appendChild(title);
      li.appendChild(excerpt);
      list.appendChild(li);
    });

    const nav = document.getElementById("sectionNav");
    const existingNotesPill = nav.querySelector(".cat-notes");
    if (existingNotesPill) existingNotesPill.remove();
    if (notes.length) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "section-pill cat-notes";
      btn.textContent = "Notes";
      btn.addEventListener("click", () => {
        document.getElementById("secNotes").scrollIntoView({ behavior: "smooth", block: "start" });
      });
      nav.appendChild(btn);
    }
  }

  document.getElementById("dayClose").addEventListener("click", () => {
    document.getElementById("dayView").hidden = true;
    teardownCarouselObserver();
  });

  function renderSectionNav(entry) {
    const nav = document.getElementById("sectionNav");
    nav.innerHTML = "";
    categoriesForEntry(entry).forEach((cat) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "section-pill cat-" + cat;
      btn.textContent = SECTION_LABELS[cat];
      btn.addEventListener("click", () => {
        document.getElementById("sec" + capitalize(cat)).scrollIntoView({ behavior: "smooth", block: "start" });
      });
      nav.appendChild(btn);
    });
  }

  function renderLinkList(listId, items) {
    const list = document.getElementById(listId);
    list.innerHTML = "";
    (items || []).forEach((item) => {
      const li = document.createElement("li");
      if (item.url) {
        const a = document.createElement("a");
        a.href = item.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = item.title || item.url;
        li.appendChild(a);
      } else {
        li.textContent = item.title || "";
      }
      list.appendChild(li);
    });
  }

  function renderSections(entry) {
    const cats = categoriesForEntry(entry);

    document.getElementById("secDid").hidden = !cats.includes("did");
    document.getElementById("didText").textContent = entry.did || "";

    document.getElementById("secWatched").hidden = !cats.includes("watched");
    renderLinkList("watchedList", entry.watched);

    document.getElementById("secSpoke").hidden = !cats.includes("spoke");
    const spokeList = document.getElementById("spokeList");
    spokeList.innerHTML = "";
    (entry.spoke || []).forEach((s) => {
      const li = document.createElement("li");
      li.textContent = (s.lang ? s.lang + " — " : "") + (s.note || "");
      spokeList.appendChild(li);
    });

    document.getElementById("secListened").hidden = !cats.includes("listened");
    renderLinkList("listenedList", entry.listened);

    document.getElementById("secLearned").hidden = !cats.includes("learned");
    document.getElementById("learnedText").textContent = entry.learned || "";
  }

  // ---------- carousel ----------
  let carouselObserver = null;
  function teardownCarouselObserver() {
    if (carouselObserver) { carouselObserver.disconnect(); carouselObserver = null; }
  }

  function renderCarousel(media) {
    const track = document.getElementById("carouselTrack");
    const dotsWrap = document.getElementById("carouselDots");
    const carousel = document.getElementById("carousel");
    track.innerHTML = "";
    dotsWrap.innerHTML = "";
    teardownCarouselObserver();

    if (!media.length) { carousel.hidden = true; return; }
    carousel.hidden = false;

    media.forEach((item, i) => {
      const slide = document.createElement("div");
      slide.className = "carousel-slide";
      if (item.type === "video") {
        const video = document.createElement("video");
        video.src = item.url;
        video.muted = true;
        video.loop = true;
        video.playsInline = true;
        video.preload = "metadata";
        slide.appendChild(video);
      } else if (item.type === "audio") {
        const wrap = document.createElement("div");
        wrap.className = "carousel-audio-slide";
        const icon = document.createElement("div");
        icon.className = "carousel-audio-icon";
        icon.textContent = "🎙️";
        const audio = document.createElement("audio");
        audio.src = item.url;
        audio.controls = true;
        audio.preload = "metadata";
        wrap.appendChild(icon);
        wrap.appendChild(audio);
        slide.appendChild(wrap);
      } else {
        const img = document.createElement("img");
        img.src = item.url;
        img.alt = "";
        img.loading = "lazy";
        slide.appendChild(img);
      }
      track.appendChild(slide);

      const dot = document.createElement("span");
      dot.className = "carousel-dot" + (i === 0 ? " active" : "");
      dotsWrap.appendChild(dot);
    });

    dotsWrap.hidden = media.length < 2;

    const slides = Array.from(track.children);
    const dots = Array.from(dotsWrap.children);

    carouselObserver = new IntersectionObserver((obsEntries) => {
      obsEntries.forEach((obs) => {
        const idx = slides.indexOf(obs.target);
        const video = obs.target.querySelector("video");
        if (obs.isIntersecting && obs.intersectionRatio >= 0.6) {
          dots.forEach((d, i) => d.classList.toggle("active", i === idx));
          if (video) video.play().catch(() => {});
        } else if (video) {
          video.pause();
        }
      });
    }, { root: track, threshold: [0, 0.6, 1] });

    slides.forEach((s) => carouselObserver.observe(s));
  }

  // ---------- beat player ----------
  function playBeatForDay(month, day) {
    const pool = (state.data.beats && state.data.beats[String(month)]) || [];
    const bar = document.getElementById("playerBar");
    const audio = document.getElementById("playerAudio");
    if (!pool.length) { bar.hidden = true; audio.pause(); return; }

    const beat = pool[(day - 1) % pool.length];
    audio.src = beat.url;
    document.getElementById("playerTitle").textContent = beat.title || "Untitled";
    bar.hidden = false;

    if (state.audioUnlocked) {
      audio.play().catch(() => { /* autoplay blocked; user can hit the toggle */ });
    }
  }

  document.getElementById("playerToggle").addEventListener("click", () => {
    const audio = document.getElementById("playerAudio");
    if (audio.paused) audio.play().catch(() => {});
    else audio.pause();
  });
  document.getElementById("playerAudio").addEventListener("play", () => {
    document.getElementById("playerToggle").innerHTML = "&#10074;&#10074;";
  });
  document.getElementById("playerAudio").addEventListener("pause", () => {
    document.getElementById("playerToggle").innerHTML = "&#9654;";
  });

  // ---------- scroll reveal: fade/slide each .reveal element in once, the
  // first time it enters view, then stop watching it (no ongoing cost) ----------
  if ("IntersectionObserver" in window) {
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add("in-view");
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    document.querySelectorAll(".reveal").forEach((el) => revealObserver.observe(el));
  } else {
    document.querySelectorAll(".reveal").forEach((el) => el.classList.add("in-view"));
  }
})();
</script>
